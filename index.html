<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PK BATTLE - サッカーPKゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
         padding: 12px 16px; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #score { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #role { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .role-kicker { background: #ff5252; }
  .role-keeper { background: #2979ff; }
  #marks { display: flex; gap: 4px; margin-top: 4px; font-size: 16px; }

  /* center message */
  #message { position: fixed; top: 18%; left: 0; right: 0; text-align: center; pointer-events: none;
             font-size: 22px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.7); transition: opacity .2s; }
  #message .big { font-size: 40px; display: block; margin-bottom: 6px; }
  #message .sub { font-size: 16px; font-weight: 400; opacity: .85; }

  /* zone grid (3x3 target zones) */
  #zonewrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
              width: min(72vw, 360px); aspect-ratio: 16 / 9; display: none; }
  #zonegrid { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
              width: 100%; height: 100%; gap: 6px; }
  .zone { border: 2px solid rgba(255,255,255,.35); border-radius: 8px; background: rgba(255,255,255,.04);
          cursor: pointer; transition: background .1s, transform .05s; }
  .zone:active { transform: scale(.95); }
  .zone.hot { background: rgba(255,255,255,.18); }

  /* timer bar */
  #timerbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16%;
              width: min(72vw, 360px); height: 8px; border-radius: 999px; background: rgba(255,255,255,.15); display: none; overflow: hidden; }
  #timerfill { height: 100%; width: 100%; background: linear-gradient(90deg,#ffeb3b,#ff5252); transition: width .05s linear; }

  /* buttons / panels */
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: radial-gradient(120% 120% at 50% 30%, rgba(20,40,90,.55), rgba(5,8,20,.92)); text-align: center; padding: 24px; }
  .panel h1 { font-size: clamp(34px, 9vw, 64px); letter-spacing: 2px; margin-bottom: 6px;
              background: linear-gradient(90deg,#4dd0e1,#fff,#ff8a80); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .panel p { opacity: .85; margin-bottom: 22px; line-height: 1.7; font-size: 15px; max-width: 420px; }
  .btn { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px; padding: 16px 40px;
         font-size: 18px; font-weight: 700; color: #08111f; background: linear-gradient(90deg,#4dd0e1,#80d8ff);
         box-shadow: 0 8px 24px rgba(0,180,255,.3); transition: transform .08s; }
  .btn:active { transform: scale(.96); }
  .hidden { display: none !important; }
  #howto { margin-top: 18px; font-size: 13px; opacity: .7; line-height: 1.8; }
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div>
    <div id="score">YOU 0 - 0 CPU</div>
    <div id="marks"></div>
  </div>
  <div id="role" class="role-kicker">KICKER</div>
</div>

<div id="message" class="hidden"></div>

<div id="zonewrap"><div id="zonegrid"></div></div>
<div id="timerbar"><div id="timerfill"></div></div>

<!-- Start menu -->
<div id="menu" class="panel">
  <h1>PK BATTLE</h1>
  <p>サッカーPK対決。<br>あなたは<b>キッカー（攻撃）</b>と<b>キーパー（守備）</b>を交互に担当。<br>全5本、より多く決めた方の勝ち！</p>
  <button class="btn" id="startBtn">▶ ゲーム開始</button>
  <div id="howto">
    ● キッカー: 狙うコースをタップ（時間内に！）<br>
    ● キーパー: ボールが来る前に飛ぶコースをタップ
  </div>
</div>

<!-- Result -->
<div id="result" class="panel hidden">
  <h1 id="resultTitle">RESULT</h1>
  <p id="resultText"></p>
  <button class="btn" id="againBtn">↻ もう一度</button>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* =========================================================================
   PK BATTLE - 初心者向けプロトタイプ
   - Three.js による簡易3DのPKゲーム
   - キッカー視点／キーパー視点を交互にプレイする5本勝負
   ========================================================================= */

// ---- 3D シーンの基本セットアップ ----
const container = document.getElementById('game');
let scene, camera, renderer;
let ball, keeper, kicker, goalGroup;
let shake = 0;                 // 画面シェイク量
let slowmo = 1;                // スローモーション係数(1=通常)

// ゴールの寸法（ゲーム用にスケール）
const GOAL_W = 7.32, GOAL_H = 2.44;
const SPOT_Z = 11;             // ペナルティスポットのz位置

// 9ゾーンの中心座標（左右×上中下）。index = row*3 + col
//   row 0 = 上, 1 = 中, 2 = 下 / col 0 = 左, 1 = 中央, 2 = 右
const ZONE_X = [-2.3, 0, 2.3];
const ZONE_Y = [2.0, 1.2, 0.45];
function zonePos(i){ return { x: ZONE_X[i % 3], y: ZONE_Y[Math.floor(i / 3)] }; }

function initScene(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1530);
  scene.fog = new THREE.Fog(0x0a1530, 25, 60);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // ライト
  scene.add(new THREE.AmbientLight(0x88aaff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5, 12, 8);
  scene.add(dir);
  // スタジアム照明っぽい点光源
  const spot = new THREE.PointLight(0xffffee, 0.6, 60);
  spot.position.set(0, 14, 6);
  scene.add(spot);

  // ピッチ（芝）
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 60),
    new THREE.MeshStandardMaterial({ color: 0x1f7a3a })
  );
  pitch.rotation.x = -Math.PI/2;
  pitch.position.z = 5;
  scene.add(pitch);
  // 芝のストライプ
  for(let i=0;i<8;i++){
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 3),
      new THREE.MeshStandardMaterial({ color: i%2 ? 0x238a44 : 0x1c6e36 })
    );
    stripe.rotation.x = -Math.PI/2;
    stripe.position.set(0, 0.01, i*3 - 4);
    scene.add(stripe);
  }

  buildGoal();
  buildBall();
  buildKeeper();
  buildKicker();
  buildCrowd();

  window.addEventListener('resize', onResize);
  animate();
}

function buildGoal(){
  goalGroup = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const postR = 0.08;
  const post = (x) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_H, 12), mat);
    m.position.set(x, GOAL_H/2, 0); return m;
  };
  goalGroup.add(post(-GOAL_W/2), post(GOAL_W/2));
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_W, 12), mat);
  bar.rotation.z = Math.PI/2; bar.position.set(0, GOAL_H, 0);
  goalGroup.add(bar);
  // ネット（半透明の面）
  const netMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_H), netMat);
  back.position.set(0, GOAL_H/2, -1.4); goalGroup.add(back);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, 1.4), netMat);
  top.rotation.x = -Math.PI/2; top.position.set(0, GOAL_H, -0.7); goalGroup.add(top);
  scene.add(goalGroup);
}

function buildBall(){
  ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 24, 24),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })
  );
  resetBall();
  scene.add(ball);
}
function resetBall(){ ball.position.set(0, 0.22, SPOT_Z); }

// 簡易キーパー（箱＋球＋腕）。差し替え前提の仮モデル
function buildKeeper(){
  keeper = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.35),
    new THREE.MeshStandardMaterial({ color: 0x222831 }));
  body.position.y = 0.95; keeper.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xe0b98c }));
  head.position.y = 1.7; keeper.add(head);
  const armMat = new THREE.MeshStandardMaterial({ color: 0x39c5bb });
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.8, 0.18), armMat);
  armL.position.set(-0.45, 1.1, 0); keeper.add(armL);
  const armR = armL.clone(); armR.position.x = 0.45; keeper.add(armR);
  keeper.position.set(0, 0, 0.3);
  scene.add(keeper);
}

// 簡易キッカー（CPUがキックするとき表示）
function buildKicker(){
  kicker = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.1, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xb71c1c }));
  body.position.y = 0.95; kicker.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xe0b98c }));
  head.position.y = 1.7; kicker.add(head);
  kicker.position.set(0.9, 0, SPOT_Z + 0.6);
  kicker.visible = false;
  scene.add(kicker);
}

function buildCrowd(){
  // 遠景のスタンド（観客の点描）
  const geo = new THREE.BufferGeometry();
  const pts = [];
  for(let i=0;i<1500;i++){
    const side = Math.random() < 0.5 ? -1 : 1;
    pts.push((Math.random()*30-15), 4 + Math.random()*8, -8 - Math.random()*6);
    pts.push(side*(14 + Math.random()*5), 3 + Math.random()*7, Math.random()*40-5);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const colors = [];
  for(let i=0;i<pts.length/3;i++){ colors.push(Math.random(), Math.random(), Math.random()); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const stand = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.35, vertexColors: true }));
  scene.add(stand);
}

// ---- カメラ位置（視点切り替え）----
function setCameraKicker(){
  // ボールの後方から、ゴールを見るアングル
  camera.position.set(0, 1.7, SPOT_Z + 3.2);
  camera.lookAt(0, 1.3, 0);
}
function setCameraKeeper(){
  // ゴール前で、飛んでくるボールを正面に受けるアングル
  camera.position.set(0, 1.6, -0.5);
  camera.lookAt(0, 1.2, SPOT_Z);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

let camBaseY = 1.7;
function animate(){
  requestAnimationFrame(animate);
  // 画面シェイク
  if(shake > 0.001){
    camera.position.x += (Math.random()-0.5) * shake;
    camera.position.y += (Math.random()-0.5) * shake;
    shake *= 0.9;
  }
  renderer.render(scene, camera);
}

/* =========================================================================
   サウンド（WebAudio。外部ファイル不要で生成）
   ========================================================================= */
let actx = null;
function ensureAudio(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } }
function tone(freq, dur, type, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.value = vol||0.2;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur);
}
function sndWhistle(){ tone(2100, 0.18, 'square', 0.15); setTimeout(()=>tone(2300,0.12,'square',0.12),120); }
function sndKick(){ tone(120, 0.12, 'triangle', 0.5); }
function sndNet(){ tone(80, 0.25, 'sawtooth', 0.25); }
function sndCheer(){
  if(!actx) return;
  // ホワイトノイズで歓声を表現
  const buf = actx.createBuffer(1, actx.sampleRate*1.2, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.min(1, i/3000) * (1 - i/d.length); }
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = 0.35;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

/* =========================================================================
   ゲーム進行（ステートマシン）
   ========================================================================= */
const MAX_ROUNDS = 5;          // 各プレイヤー5本
let round = 0;                 // 0..(MAX_ROUNDS*2-1) を交互に
let youScore = 0, cpuScore = 0;
let history = [];              // 各キックの結果表示用
let busy = false;              // 入力ロック

const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const marksEl = document.getElementById('marks');
const roleEl = document.getElementById('role');
const msgEl = document.getElementById('message');
const zoneWrap = document.getElementById('zonewrap');
const zoneGrid = document.getElementById('zonegrid');
const timerBar = document.getElementById('timerbar');
const timerFill = document.getElementById('timerfill');

// 9つのゾーンボタンを生成
let zoneButtons = [];
function buildZoneButtons(){
  zoneGrid.innerHTML = '';
  zoneButtons = [];
  for(let i=0;i<9;i++){
    const b = document.createElement('div');
    b.className = 'zone';
    b.dataset.i = i;
    zoneGrid.appendChild(b);
    zoneButtons.push(b);
  }
}

function showMessage(big, sub, ms){
  msgEl.innerHTML = `<span class="big">${big}</span>` + (sub?`<span class="sub">${sub}</span>`:'');
  msgEl.classList.remove('hidden');
  if(ms){ setTimeout(()=>msgEl.classList.add('hidden'), ms); }
}
function hideMessage(){ msgEl.classList.add('hidden'); }

function updateHud(){
  scoreEl.textContent = `YOU ${youScore} - ${cpuScore} CPU`;
  marksEl.innerHTML = history.map(h => h.goal ? '⚽' : '✖').join('');
}

// 「あなたがキッカー」のターンか？（偶数ラウンド=あなたがキッカー）
function youAreKicker(){ return round % 2 === 0; }

function startGame(){
  ensureAudio();
  round = 0; youScore = 0; cpuScore = 0; history = [];
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  hud.classList.remove('hidden');
  buildZoneButtons();
  updateHud();
  nextRound();
}

function nextRound(){
  if(round >= MAX_ROUNDS * 2){ endGame(); return; }
  busy = false;
  resetBall();
  keeper.position.set(0, 0, 0.3);
  keeper.rotation.z = 0;
  kicker.visible = false;
  const kickerTurn = youAreKicker();
  roleEl.textContent = kickerTurn ? 'KICKER' : 'KEEPER';
  roleEl.className = kickerTurn ? 'role-kicker' : 'role-keeper';

  const shotNo = Math.floor(round/2) + 1;
  if(kickerTurn){
    setCameraKicker();
    keeper.visible = true;
    showMessage(`第${shotNo}本 / 攻撃`, 'コースをタップして狙え！', 1400);
    sndWhistle();
    setTimeout(kickerPhase, 1500);
  } else {
    setCameraKeeper();
    keeper.visible = true;
    kicker.visible = true;
    showMessage(`第${shotNo}本 / 守備`, 'ボールが来るコースを読め！', 1400);
    sndWhistle();
    setTimeout(keeperPhase, 1500);
  }
}

/* ---- キッカーフェーズ：あなたが狙う ---- */
function kickerPhase(){
  hideMessage();
  zoneWrap.style.display = 'block';
  timerBar.style.display = 'block';
  let done = false;
  const t = 3.0; // 制限時間（秒）：緊張感の演出
  const startT = performance.now();

  function shoot(zone, timedOut){
    if(done) return;
    done = true;
    clearInterval(timer);
    cleanupZones();        // リスナーごとボタンを作り直す
    doKickerShot(zone, timedOut);
  }

  // ゾーンをタップ＝即シュート
  zoneButtons.forEach(b=>{
    b.addEventListener('click', ()=> shoot(parseInt(b.dataset.i,10), false));
  });

  // 制限時間。切れたら中央下へ弱いシュート（決まりにくい）
  const timer = setInterval(()=>{
    const left = Math.max(0, t - (performance.now()-startT)/1000);
    timerFill.style.width = (left/t*100) + '%';
    if(left <= 0){ shoot(7, true); }
  }, 50);
}

function doKickerShot(zone, timedOut){
  busy = true;
  sndKick(); shake = 0.25;
  // CPUキーパーの読み：30%で正解ゾーン、70%でランダム
  let guess;
  if(Math.random() < 0.30){ guess = zone; }
  else { guess = Math.floor(Math.random()*9); }
  diveKeeper(guess);

  const target = zonePos(zone);
  // 時間切れ/隅すぎは枠外リスク
  let offTarget = timedOut && Math.random()<0.5;
  const isCorner = (zone===0||zone===2||zone===6||zone===8);
  if(isCorner && Math.random()<0.12) offTarget = true;

  const tx = offTarget ? target.x * 1.4 : target.x;
  const ty = offTarget ? target.y + 0.8 : target.y;

  flyBall({x:tx, y:ty, z:0}, 0.55, ()=>{
    const saved = (guess === zone) && !offTarget;
    if(offTarget){
      resolveShot(false, '枠外！', 'ねらい過ぎた…');
    } else if(saved){
      resolveShot(false, 'SAVED!', 'キーパーに読まれた！');
      sndNet();
    } else {
      resolveShot(true, 'GOAL!!', 'ナイスシュート！');
      sndNet(); sndCheer();
    }
  });
}

/* ---- キーパーフェーズ：あなたが守る ---- */
function keeperPhase(){
  hideMessage();
  zoneWrap.style.display = 'block';
  // CPUが狙うゾーンを決定
  const targetZone = Math.floor(Math.random()*9);
  let playerDive = -1;
  let resolved = false;

  // 助走方向のヒント（少しだけテレグラフ）
  kicker.position.x = (zonePos(targetZone).x>0? 1.1 : (zonePos(targetZone).x<0? 0.7 : 0.9));

  function onDive(e){
    if(resolved) return;
    playerDive = parseInt(e.currentTarget.dataset.i, 10);
    zoneButtons.forEach(b=>b.classList.remove('hot'));
    e.currentTarget.classList.add('hot');
    diveKeeper(playerDive);
    sndKick();
  }
  zoneButtons.forEach(b=> b.addEventListener('click', onDive));

  // 少し溜めてからキック（CPUの助走）
  const delay = 700 + Math.random()*500;
  setTimeout(()=>{
    sndKick(); shake = 0.2; kicker.visible = false;
    const target = zonePos(targetZone);
    flyBall({x:target.x, y:target.y, z:0.3}, 0.6, ()=>{
      resolved = true;
      cleanupZones();
      zoneButtons.forEach(b=> b.removeEventListener('click', onDive));
      const saved = (playerDive === targetZone);
      if(saved){
        resolveShot(false, 'SAVE!!', 'ビッグセーブ！', true);
        slowmoFlash(); sndCheer();
      } else {
        resolveShot(true, 'GOAL...', playerDive<0?'反応できず…':'逆を突かれた…', true);
        sndNet();
      }
    });
  }, delay);
}

// キーパーがダイブする見た目
function diveKeeper(zone){
  const p = zonePos(zone);
  keeper.position.x = p.x * 0.7;
  keeper.position.y = Math.max(0, p.y - 1.0);
  keeper.rotation.z = -Math.sign(p.x) * 0.7;
}

// ボールを目標へ飛ばす（duration秒）
function flyBall(target, duration, done){
  const start = { x: ball.position.x, y: ball.position.y, z: ball.position.z };
  const t0 = performance.now();
  function step(){
    const k = Math.min(1, (performance.now()-t0)/(duration*1000));
    const e = 1 - Math.pow(1-k, 2); // ease-out
    ball.position.x = start.x + (target.x-start.x)*e;
    ball.position.y = start.y + (target.y-start.y)*e + Math.sin(e*Math.PI)*0.3; // 弧
    ball.position.z = start.z + (target.z-start.z)*e;
    ball.rotation.x += 0.4; ball.rotation.y += 0.3;
    if(k < 1){ requestAnimationFrame(step); }
    else if(done){ done(); }
  }
  step();
}

function slowmoFlash(){
  shake = 0.35;
}

// 1本の結果を確定して次へ
function resolveShot(isGoal, big, sub){
  // isGoal: ボールがネットを揺らしたか
  const youKicked = youAreKicker();
  // あなたがキッカー: ゴール=あなた得点 / あなたがキーパー: ゴール=CPU得点
  if(isGoal){
    if(youKicked) youScore++; else cpuScore++;
  }
  history.push({ goal: isGoal });
  updateHud();
  zoneWrap.style.display = 'none';
  timerBar.style.display = 'none';
  showMessage(big, sub, 0);
  setTimeout(()=>{
    hideMessage();
    round++;
    nextRound();
  }, 1900);
}

function cleanupZones(){
  zoneButtons.forEach(b=> b.classList.remove('hot'));
  // クローンで全リスナー除去（簡易）
  buildZoneButtons();
}

function endGame(){
  hud.classList.add('hidden');
  zoneWrap.style.display = 'none';
  const win = youScore > cpuScore, draw = youScore === cpuScore;
  document.getElementById('resultTitle').textContent = win ? 'YOU WIN! 🏆' : draw ? 'DRAW' : 'YOU LOSE...';
  document.getElementById('resultText').innerHTML =
    `最終スコア<br><b style="font-size:28px">YOU ${youScore} - ${cpuScore} CPU</b>`;
  document.getElementById('result').classList.remove('hidden');
  if(win){ sndCheer(); }
}

// ---- 起動 ----
initScene();
setCameraKicker();
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
</script>
