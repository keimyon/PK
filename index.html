<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PK BATTLE - サッカーPKゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05080f; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* 画面端の軽いビネット（没入感） */
  #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 220px 40px rgba(0,0,0,.55); }

  /* HUD */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
         padding: 12px 16px; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #score { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  #marks { display: flex; gap: 4px; margin-top: 4px; font-size: 15px; min-height: 18px; }
  #rightHud { text-align: right; }
  #role { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; }
  .role-kicker { background: linear-gradient(90deg,#ff5252,#ff8a65); }
  .role-keeper { background: linear-gradient(90deg,#2979ff,#40c4ff); }
  #diffTag { margin-top: 6px; font-size: 11px; opacity: .8; letter-spacing: 1px; }

  /* center message */
  #message { position: fixed; top: 16%; left: 0; right: 0; text-align: center; pointer-events: none;
             font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.8); transition: opacity .2s; }
  #message .big { font-size: clamp(34px,11vw,52px); display: block; margin-bottom: 6px; }
  #message .sub { font-size: 16px; font-weight: 500; opacity: .9; }

  /* zone grid (3x3 target zones) */
  #zonewrap { position: fixed; left: 50%; top: 48%; transform: translate(-50%,-50%);
              width: min(74vw, 380px); aspect-ratio: 16 / 10; display: none; }
  #zonegrid { display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
              width: 100%; height: 100%; gap: 6px; }
  .zone { border: 2px solid rgba(255,255,255,.30); border-radius: 10px; background: rgba(255,255,255,.04);
          cursor: pointer; transition: background .1s, transform .05s, border-color .1s; }
  .zone:active { transform: scale(.94); }
  .zone.hot { background: rgba(255,235,59,.22); border-color: rgba(255,235,59,.9); }

  /* timer bar */
  #timerbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 15%;
              width: min(74vw, 380px); height: 9px; border-radius: 999px; background: rgba(255,255,255,.15); display: none; overflow: hidden; }
  #timerfill { height: 100%; width: 100%; background: linear-gradient(90deg,#ffeb3b,#ff5252); transition: width .05s linear; }

  /* panels */
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: radial-gradient(120% 120% at 50% 25%, rgba(20,45,100,.5), rgba(4,7,16,.93)); text-align: center; padding: 24px; }
  .panel h1 { font-size: clamp(36px, 10vw, 70px); letter-spacing: 3px; margin-bottom: 4px; font-weight: 900;
              background: linear-gradient(90deg,#4dd0e1,#fff,#ff8a80); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { opacity: .7; letter-spacing: 4px; font-size: 12px; margin-bottom: 22px; }
  .panel p { opacity: .9; margin-bottom: 18px; line-height: 1.7; font-size: 15px; max-width: 440px; }
  .label { font-size: 12px; opacity: .7; letter-spacing: 2px; margin-bottom: 10px; }
  .diffrow { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
  .diffbtn { pointer-events: auto; cursor: pointer; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06);
             color: #fff; border-radius: 12px; padding: 10px 18px; font-size: 15px; font-weight: 700; transition: all .12s; }
  .diffbtn.sel { border-color: #4dd0e1; background: rgba(77,208,225,.18); box-shadow: 0 0 16px rgba(77,208,225,.4); }
  .btn { pointer-events: auto; cursor: pointer; border: none; border-radius: 999px; padding: 16px 44px;
         font-size: 19px; font-weight: 800; color: #08111f; background: linear-gradient(90deg,#4dd0e1,#80d8ff);
         box-shadow: 0 8px 28px rgba(0,180,255,.35); transition: transform .08s; }
  .btn:active { transform: scale(.96); }
  .hidden { display: none !important; }
  #howto { margin-top: 20px; font-size: 13px; opacity: .65; line-height: 1.9; }

  /* ゾーン入力が無効な間（反応待ち）は薄く */
  #zonewrap.disabled { opacity: .35; }

  /* キッカーのミート・タイミングゲージ */
  #meter { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
           width: min(86vw, 460px); height: 46px; border-radius: 12px; background: rgba(0,0,0,.55);
           border: 2px solid rgba(255,255,255,.3); display: none; overflow: hidden; z-index: 6;
           box-shadow: 0 10px 40px rgba(0,0,0,.5); pointer-events: none; }
  #meterBand { position: absolute; top: 0; bottom: 0; left: 41%; width: 18%;
               background: repeating-linear-gradient(45deg, rgba(76,222,128,.85), rgba(76,222,128,.85) 8px, rgba(56,190,108,.85) 8px, rgba(56,190,108,.85) 16px);
               border-left: 2px solid #eaffea; border-right: 2px solid #eaffea; }
  #meterBand::after { content: 'JUST'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font-size: 13px; font-weight: 900; color: #06320f; letter-spacing: 2px; }
  #meterMark { position: absolute; top: -4px; bottom: -4px; width: 8px; left: 0; border-radius: 4px;
               background: #fff200; box-shadow: 0 0 14px #fff200, 0 0 4px #fff; }
  #meterLabel { position: fixed; left: 50%; top: calc(50% - 56px); transform: translateX(-50%);
                font-size: 18px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.8); display: none; z-index: 6; white-space: nowrap; pointer-events: none; }
  #meterHit { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22%;
              font-size: 16px; font-weight: 700; color: rgba(255,255,255,.5);
              z-index: 5; cursor: pointer; user-select: none; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="vignette"></div>

<div id="hud" class="hidden">
  <div>
    <div id="score">YOU 0 - 0 CPU</div>
    <div id="marks"></div>
  </div>
  <div id="rightHud">
    <div id="role" class="role-kicker">KICKER</div>
    <div id="diffTag">NORMAL</div>
  </div>
</div>

<div id="message" class="hidden"></div>

<div id="zonewrap"><div id="zonegrid"></div></div>
<div id="timerbar"><div id="timerfill"></div></div>

<!-- キッカーのミート・タイミングゲージ -->
<div id="meterLabel">⚽ JUSTゾーンでタップ！</div>
<div id="meter"><div id="meterBand"></div><div id="meterMark"></div></div>
<div id="meterHit" class="hidden">画面のどこでもタップ</div>

<!-- Start menu -->
<div id="menu" class="panel">
  <h1>PK BATTLE</h1>
  <div class="tagline">KICKER vs KEEPER</div>
  <div class="label">難易度をえらぶ</div>
  <div class="diffrow" id="diffRow">
    <button class="diffbtn" data-d="EASY">かんたん</button>
    <button class="diffbtn sel" data-d="NORMAL">ふつう</button>
    <button class="diffbtn" data-d="HARD">むずかしい</button>
  </div>
  <button class="btn" id="startBtn">▶ ゲーム開始</button>
  <div id="howto">
    ● キッカー: コースを選び、ゲージ中央でジャストにタップしてミート<br>
    ● キーパー: シュートを見てから、飛ぶコースに反応してタップ<br>
    全5本・攻守交代。多く決めた方の勝ち
  </div>
</div>

<!-- Result -->
<div id="result" class="panel hidden">
  <h1 id="resultTitle">RESULT</h1>
  <p id="resultText"></p>
  <button class="btn" id="againBtn">↻ もう一度</button>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
/* =========================================================================
   PK BATTLE - サッカーPKゲーム（プロトタイプ v2）
   - Three.js による簡易3D。キッカー視点／キーパー視点を交互にプレイ
   - 影・スタジアム照明・観客・ピッチライン等で臨場感を強化
   - 難易度（かんたん/ふつう/むずかしい）で歯ごたえを調整
   ========================================================================= */

// ---- ゴール寸法とゾーン定義（実寸に近いスケール）----
const GOAL_W = 7.32, GOAL_H = 2.44;
const SPOT_Z = 11;                 // ペナルティスポット
const ZONE_X = [-2.5, 0, 2.5];     // 左/中央/右
const ZONE_Y = [2.05, 1.2, 0.45];  // 上/中/下
function zonePos(i){ return { x: ZONE_X[i % 3], y: ZONE_Y[Math.floor(i / 3)] }; }
function zoneRC(i){ return { r: Math.floor(i/3), c: i%3 }; }
function isAdjacent(a, b){
  const A = zoneRC(a), B = zoneRC(b);
  return (Math.abs(A.r-B.r) + Math.abs(A.c-B.c)) === 1;
}
const CORNERS = [0, 2, 6, 8];

// ---- 難易度設定 ----
//  flyKeeper = 守備時の反応猶予（ボール到達までの秒数。短いほど難しい）
//  setPause  = 蹴ってからボールが飛び出すまでの構えの間（秒）
//  meterSpeed/bandHalf = 攻撃時ミートゲージの速さ/的の広さ(%)
const DIFFS = {
  EASY:   { read:0.30, cpuAdj:0.12, flyKeeper:1.25, setPause:0.28, flyKick:0.60, cornerBias:0.30, feint:0.00, playerAdj:0.45, aimTime:4.0, meterSpeed:0.70, bandHalf:16 },
  NORMAL: { read:0.46, cpuAdj:0.30, flyKeeper:1.00, setPause:0.22, flyKick:0.55, cornerBias:0.55, feint:0.18, playerAdj:0.34, aimTime:3.5, meterSpeed:1.00, bandHalf:11 },
  HARD:   { read:0.62, cpuAdj:0.46, flyKeeper:0.78, setPause:0.16, flyKick:0.50, cornerBias:0.78, feint:0.32, playerAdj:0.22, aimTime:3.0, meterSpeed:1.40, bandHalf:8 },
};
let diffKey = 'NORMAL';
let diff = DIFFS[diffKey];

// ---- Three.js 基本 ----
const container = document.getElementById('game');
let scene, camera, renderer;
let ball, keeper, kicker, goalGroup;
let shake = 0;
let camBase = new THREE.Vector3();
// キーパーのダイブを滑らかに見せるための目標姿勢
let keeperTarget = { x:0, y:0, z:0.3, rotZ:0, arm:0 };

function rand(){ return Math.random(); }

function initScene(){
  scene = new THREE.Scene();
  scene.background = makeSkyTexture();
  scene.fog = new THREE.Fog(0x0a1730, 35, 95);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 300);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // --- ライティング ---
  scene.add(new THREE.HemisphereLight(0x8ab0ff, 0x2a3a20, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(8, 18, 14);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1; key.shadow.camera.far = 60;
  key.shadow.camera.left = -20; key.shadow.camera.right = 20;
  key.shadow.camera.top = 25;  key.shadow.camera.bottom = -5;
  scene.add(key);

  buildPitch();
  buildGoal();
  buildBall();
  keeper = buildHumanoid({ shirt:0x1b1f27, shorts:0x111419, sock:0x222831, skin:0xe7b48a, glove:0x39e0c8 });
  keeper.position.set(0, 0, 0.3);
  scene.add(keeper);
  kicker = buildHumanoid({ shirt:0xc62828, shorts:0xffffff, sock:0xc62828, skin:0xe7b48a, glove:null });
  kicker.position.set(0.9, 0, SPOT_Z + 0.6);
  kicker.visible = false;
  scene.add(kicker);

  buildStadium();
  buildFloodlights();

  window.addEventListener('resize', onResize);
  animate();
}

// 夜のスタジアム空（縦グラデーション）
function makeSkyTexture(){
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0, '#040814');
  g.addColorStop(0.55, '#0c1830');
  g.addColorStop(1, '#1d3358');
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0,0,2,256);
  const t = new THREE.CanvasTexture(c);
  return t;
}

function buildPitch(){
  // 芝（ストライプをテクスチャで表現）
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  for(let i=0;i<16;i++){ ctx.fillStyle = i%2 ? '#2a8f49' : '#23823f'; ctx.fillRect(0, i*32, 512, 32); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3,3);
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 90),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })
  );
  pitch.rotation.x = -Math.PI/2;
  pitch.position.z = 12;
  pitch.receiveShadow = true;
  scene.add(pitch);

  // 白線（ペナルティエリア・ゴールエリア・スポット・アーク）
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
  const y = 0.02;
  const addLine = (pts) => {
    const g = new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0], y, p[1])));
    scene.add(new THREE.Line(g, lineMat));
  };
  // ゴールライン
  addLine([[-25,0],[25,0]]);
  // ペナルティエリア（深さ16.5 / 幅±20.16）
  addLine([[-20.16,0],[-20.16,16.5],[20.16,16.5],[20.16,0]]);
  // ゴールエリア（深さ5.5 / 幅±9.16）
  addLine([[-9.16,0],[-9.16,5.5],[9.16,5.5],[9.16,0]]);
  // ペナルティアーク（スポット中心・半径9.15のうちエリア外の弧）
  const arcPts = [];
  for(let a=-60; a<=60; a+=6){
    const rad = (a-90) * Math.PI/180;
    arcPts.push([Math.cos(rad)*9.15, SPOT_Z + Math.sin(rad)*9.15]);
  }
  // エリア線(z=16.5)より外側だけ描く
  addLine(arcPts.filter(p=>p[1]>=16.5));
  // ペナルティスポット
  const spot = new THREE.Mesh(new THREE.CircleGeometry(0.2, 16), new THREE.MeshBasicMaterial({ color:0xffffff }));
  spot.rotation.x = -Math.PI/2; spot.position.set(0, 0.02, SPOT_Z); scene.add(spot);
}

function buildGoal(){
  goalGroup = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const postR = 0.06;   // 実寸: ゴールポスト径は最大12cm = 半径0.06m
  const post = (x) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_H, 12), mat);
    m.position.set(x, GOAL_H/2, 0); m.castShadow = true; return m;
  };
  goalGroup.add(post(-GOAL_W/2), post(GOAL_W/2));
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_W + postR*2, 12), mat);
  bar.rotation.z = Math.PI/2; bar.position.set(0, GOAL_H, 0); bar.castShadow = true;
  goalGroup.add(bar);

  // ネット（格子線で表現）
  const depth = 1.6;
  const netMat = new THREE.LineBasicMaterial({ color: 0xdfe7ff, transparent: true, opacity: 0.35 });
  const segs = [];
  const W = GOAL_W/2;
  // 背面の格子
  for(let x=-W; x<=W; x+=0.42){ segs.push(x,0,-depth, x,GOAL_H,-depth); }
  for(let yy=0; yy<=GOAL_H; yy+=0.4){ segs.push(-W,yy,-depth, W,yy,-depth); }
  // 上面
  for(let x=-W; x<=W; x+=0.42){ segs.push(x,GOAL_H,0, x,GOAL_H,-depth); }
  // 側面
  for(let z=0; z>=-depth; z-=0.4){ segs.push(-W,0,z,-W,GOAL_H,z); segs.push(W,0,z,W,GOAL_H,z); }
  const ng = new THREE.BufferGeometry();
  ng.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  goalGroup.add(new THREE.LineSegments(ng, netMat));
  scene.add(goalGroup);
}

function buildBall(){
  // サッカーボール風テクスチャ（白地に黒のパッチ）
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(0,0,256,128);
  ctx.fillStyle = '#15171c';
  const patch = (cx,cy,r) => {
    ctx.beginPath();
    for(let k=0;k<5;k++){ const a=k/5*Math.PI*2 - Math.PI/2; const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; k?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fill();
  };
  patch(40,64,16); patch(120,40,15); patch(120,96,15); patch(200,64,16);
  const tex = new THREE.CanvasTexture(c);
  // 実寸: サッカーボールは直径約22cm = 半径0.11m
  ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.11, 28, 28),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 })
  );
  ball.castShadow = true;
  resetBall();
  scene.add(ball);
}
function resetBall(){ ball.position.set(0, 0.11, SPOT_Z); }

// 人型キャラ（プリミティブ組み立て。後でMixamo等に差し替え可能）
function buildHumanoid(col){
  const g = new THREE.Group();
  const M = (c)=> new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
  const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; g.add(m); return m; };
  // 脚（股関節でピボットさせ、助走・キックで振れるようにグループ化）
  function legGroup(x){
    const grp = new THREE.Group();
    grp.position.set(x, 0.78, 0);                    // 股関節の高さ
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.75,0.2), M(col.sock));
    m.position.y = -0.4; m.castShadow = true;        // 脚は股関節からぶら下がる
    grp.add(m); g.add(grp); return grp;
  }
  const legL = legGroup(-0.13), legR = legGroup(0.13);
  // 胴
  part(new THREE.BoxGeometry(0.52,0.72,0.3), M(col.shirt), 0, 1.05, 0);
  // 頭
  part(new THREE.SphereGeometry(0.21,18,18), M(col.skin), 0, 1.58, 0);
  // 腕（ポーズ変更のため参照を保持）
  const armGeo = new THREE.BoxGeometry(0.14,0.66,0.14);
  const armL = part(armGeo, M(col.shirt), -0.37, 1.08, 0);
  const armR = part(armGeo, M(col.shirt),  0.37, 1.08, 0);
  if(col.glove){
    part(new THREE.BoxGeometry(0.2,0.2,0.2), M(col.glove), -0.37, 0.74, 0);
    part(new THREE.BoxGeometry(0.2,0.2,0.2), M(col.glove),  0.37, 0.74, 0);
  }
  g.userData.armL = armL; g.userData.armR = armR;
  g.userData.legL = legL; g.userData.legR = legR;
  return g;
}

// 全メッシュのポーズ（腕・脚の回転）をリセット
function resetPose(player){
  ['armL','armR','legL','legR'].forEach(k=>{ const p = player.userData[k]; if(p) p.rotation.set(0,0,0); });
}
// 半透明・不透明の切り替え
function setOpacity(player, op){
  player.traverse(o=>{ if(o.isMesh){ o.material.transparent = op < 1; o.material.opacity = op; o.material.depthWrite = op >= 1; } });
}
// 助走 → キックのモーション。接地（キック）時に onContact() を呼ぶ
function runUp(player, from, plant, duration, onContact){
  player.position.set(from.x, from.y, from.z);
  const legL = player.userData.legL, legR = player.userData.legR;
  const t0 = performance.now();
  let fired = false;
  function step(){
    const t = (performance.now()-t0)/1000;
    const k = Math.min(1, t/duration);
    const e = k*k;                                   // ease-in（だんだん加速）
    player.position.x = from.x + (plant.x-from.x)*e;
    player.position.z = from.z + (plant.z-from.z)*e;
    const jog = Math.sin(t*22) * 0.6 * (1 - k*0.3);  // 脚を交互に振る
    if(legL) legL.rotation.x = jog;
    if(legR) legR.rotation.x = -jog;
    if(k < 1){ requestAnimationFrame(step); }
    else if(!fired){
      fired = true;
      if(legR) legR.rotation.x = -1.3;               // 蹴り足を振り抜く
      if(legL) legL.rotation.x = 0.3;
      if(onContact) onContact();
      setTimeout(()=>{ if(legR) legR.rotation.x = 0; if(legL) legL.rotation.x = 0; }, 350);
    }
  }
  step();
}

function buildStadium(){
  // 観客スタンド（傾いた板）＋観客（点）を四方に配置
  const standMat = new THREE.MeshStandardMaterial({ color: 0x10131c, roughness: 1 });
  function stand(px, pz, w, d, ry){
    const s = new THREE.Mesh(new THREE.BoxGeometry(w, 9, d), standMat);
    s.position.set(px, 4.5, pz); s.rotation.y = ry; s.rotation.x = -0.32; scene.add(s);
  }
  stand(0, -12, 70, 14, 0);          // ゴール裏
  stand(0, 36, 70, 14, 0);           // 反対側
  stand(-34, 12, 60, 14, Math.PI/2); // 左
  stand(34, 12, 60, 14, Math.PI/2);  // 右

  // 観客（カラフルな点）
  const pts = [], cols = [];
  function crowd(cx, cz, w, d){
    for(let i=0;i<900;i++){
      pts.push(cx + (rand()-0.5)*w, 3 + rand()*8, cz + (rand()-0.5)*d);
      const h = rand(); cols.push(0.4+rand()*0.6, 0.4+rand()*0.6, 0.4+rand()*0.6);
    }
  }
  crowd(0,-12,66,8); crowd(0,36,66,8); crowd(-33,12,8,56); crowd(33,12,8,56);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size:0.5, vertexColors:true })));
}

function buildFloodlights(){
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x444a55 });
  const panelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffee, emissiveIntensity: 1 });
  [[-28,-14],[28,-14],[-28,38],[28,38]].forEach(([x,z])=>{
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,18,8), poleMat);
    pole.position.set(x, 9, z); scene.add(pole);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(3,1.4,0.3), panelMat);
    panel.position.set(x, 18, z); panel.lookAt(0, 2, 12); scene.add(panel);
    const pl = new THREE.PointLight(0xfff6e0, 0.35, 80); pl.position.set(x, 17, z); scene.add(pl);
  });
}

function setCameraKicker(){
  // ボール後方やや上空。助走する自分とゴールの両方が見える
  camBase.set(0, 2.0, SPOT_Z + 4.5);
  camera.position.copy(camBase);
  camera.lookAt(0, 1.2, 1);
}
function setCameraKeeper(){
  // ゴール裏やや上から。キーパー全体を手前に映し、奥のキッカーも見える
  camBase.set(0, 2.3, -2.7);
  camera.position.copy(camBase);
  camera.lookAt(0, 1.1, 9);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
  requestAnimationFrame(animate);
  // キーパーの姿勢を目標へ滑らかに補間（ダイブ演出）
  if(keeper){
    keeper.position.x += (keeperTarget.x - keeper.position.x) * 0.35;
    keeper.position.y += (keeperTarget.y - keeper.position.y) * 0.35;
    keeper.rotation.z += (keeperTarget.rotZ - keeper.rotation.z) * 0.35;
    const aL = keeper.userData.armL, aR = keeper.userData.armR;
    if(aL){ aL.rotation.z += ( keeperTarget.arm - aL.rotation.z) * 0.3; }
    if(aR){ aR.rotation.z += (-keeperTarget.arm - aR.rotation.z) * 0.3; }
  }
  // 画面シェイク（ベース位置からのオフセット）
  if(shake > 0.002){
    camera.position.set(
      camBase.x + (rand()-0.5)*shake,
      camBase.y + (rand()-0.5)*shake,
      camBase.z
    );
    shake *= 0.88;
  } else {
    camera.position.copy(camBase);
  }
  renderer.render(scene, camera);
}

/* =========================================================================
   サウンド（WebAudio。外部ファイル不要）
   ========================================================================= */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(freq, dur, type, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine'; o.frequency.value = freq; g.gain.value = vol||0.2;
  o.connect(g); g.connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur);
}
function sndWhistle(){ tone(2100,0.18,'square',0.13); setTimeout(()=>tone(2300,0.12,'square',0.1),120); }
function sndKick(){ tone(120,0.12,'triangle',0.5); }
function sndNet(){ tone(80,0.25,'sawtooth',0.22); }
function sndCheer(){
  if(!actx) return;
  const buf = actx.createBuffer(1, actx.sampleRate*1.3, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i] = (rand()*2-1) * Math.min(1, i/3000) * (1 - i/d.length); }
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = 0.35;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

/* =========================================================================
   ゲーム進行
   ========================================================================= */
const MAX_ROUNDS = 5;
let round = 0, youScore = 0, cpuScore = 0, history = [];
let lastPlayerKickZone = -1;   // 連続で同じコースを狙うと読まれやすくする

const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const marksEl = document.getElementById('marks');
const roleEl = document.getElementById('role');
const diffTagEl = document.getElementById('diffTag');
const msgEl = document.getElementById('message');
const zoneWrap = document.getElementById('zonewrap');
const zoneGrid = document.getElementById('zonegrid');
const timerBar = document.getElementById('timerbar');
const timerFill = document.getElementById('timerfill');
const meterEl = document.getElementById('meter');
const meterBand = document.getElementById('meterBand');
const meterMark = document.getElementById('meterMark');
const meterHit = document.getElementById('meterHit');
const meterLabel = document.getElementById('meterLabel');

let zoneButtons = [];
function buildZoneButtons(){
  zoneGrid.innerHTML = ''; zoneButtons = [];
  for(let i=0;i<9;i++){
    const b = document.createElement('div');
    b.className = 'zone'; b.dataset.i = i;
    zoneGrid.appendChild(b); zoneButtons.push(b);
  }
}
function cleanupZones(){ buildZoneButtons(); }

function showMessage(big, sub, ms){
  msgEl.innerHTML = `<span class="big">${big}</span>` + (sub?`<span class="sub">${sub}</span>`:'');
  msgEl.classList.remove('hidden');
  if(ms){ setTimeout(()=>msgEl.classList.add('hidden'), ms); }
}
function hideMessage(){ msgEl.classList.add('hidden'); }

function updateHud(){
  scoreEl.textContent = `YOU ${youScore} - ${cpuScore} CPU`;
  marksEl.innerHTML = history.map(h => h.goal ? '⚽' : '✖').join('');
  diffTagEl.textContent = diffKey;
}

function youAreKicker(){ return round % 2 === 0; }

// キーパー姿勢をセット（zone方向へダイブ）
function poseKeeper(zone, ready){
  if(ready){ keeperTarget = { x:0, y:0, z:0.3, rotZ:0, arm:0.2 }; return; }
  const p = zonePos(zone);
  keeperTarget = {
    x: p.x * 0.72,
    y: Math.max(0, p.y - 1.0),
    z: 0.3,
    rotZ: -Math.sign(p.x) * 0.9,
    arm: 1.3,
  };
}

function startGame(){
  ensureAudio();
  diff = DIFFS[diffKey];
  round = 0; youScore = 0; cpuScore = 0; history = []; lastPlayerKickZone = -1;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  hud.classList.remove('hidden');
  buildZoneButtons(); updateHud();
  nextRound();
}

function nextRound(){
  if(round >= MAX_ROUNDS * 2){ endGame(); return; }
  resetBall();
  poseKeeper(0, true);
  resetPose(kicker); resetPose(keeper);
  keeper.visible = true; kicker.visible = true;
  const kickerTurn = youAreKicker();
  roleEl.textContent = kickerTurn ? 'KICKER' : 'KEEPER';
  roleEl.className = kickerTurn ? 'role-kicker' : 'role-keeper';

  const shotNo = Math.floor(round/2) + 1;
  if(kickerTurn){
    // 攻撃: 自分（キッカー）を映す。キーパーは奥で不透明
    setCameraKicker();
    setOpacity(keeper, 1);
    kicker.position.set(-1.8, 0, 13.9);   // 助走開始位置（カメラ手前）
    showMessage(`第${shotNo}本 / 攻撃`, 'コースをタップして狙え！', 1400);
    sndWhistle(); setTimeout(kickerPhase, 1500);
  } else {
    // 守備: キーパー全体を手前に映し半透明化、奥の相手キッカーが透けて見える
    setCameraKeeper();
    setOpacity(keeper, 0.45);
    kicker.position.set(0.9, 0, 12.6);
    showMessage(`第${shotNo}本 / 守備`, 'ボールが来るコースを読め！', 1400);
    sndWhistle(); setTimeout(keeperPhase, 1500);
  }
}

/* ---- キッカーフェーズ：①コース選択 → ②ミートのタイミング反応 ---- */
function kickerPhase(){
  hideMessage();
  // ① 狙うコースを選択
  zoneWrap.style.display = 'block';
  zoneWrap.classList.remove('disabled');
  timerBar.style.display = 'block';
  let chosen = false;
  const t = diff.aimTime;
  const startT = performance.now();

  function choose(zone){
    if(chosen) return; chosen = true;
    clearInterval(timer);
    cleanupZones(); zoneWrap.style.display = 'none'; timerBar.style.display = 'none';
    startTimingMeter(zone);
  }
  zoneButtons.forEach(b=> b.addEventListener('click', ()=> choose(parseInt(b.dataset.i,10))));

  const timer = setInterval(()=>{
    const left = Math.max(0, t - (performance.now()-startT)/1000);
    timerFill.style.width = (left/t*100) + '%';
    if(left <= 0){ choose(4); }   // 未選択なら中央へ
  }, 50);
}

// ② ミート・タイミングゲージ。中央のJUSTゾーンでタップできれば good/perfect
function startTimingMeter(zone){
  meterEl.style.display = 'block';
  meterLabel.style.display = 'block';
  meterBand.style.left = (50 - diff.bandHalf) + '%';
  meterBand.style.width = (diff.bandHalf * 2) + '%';
  meterHit.classList.remove('hidden');

  let done = false;
  const t0 = performance.now();
  let raf;
  function frame(){
    const t = (performance.now() - t0) / 1000;
    // 0..100 を往復（三角波）
    const phase = (t * diff.meterSpeed) % 1;
    const pos = (phase < 0.5 ? phase*2 : (1-phase)*2) * 100;
    meterMark.style.left = 'calc(' + pos + '% - 4px)';
    meterMark.dataset.pos = pos;
    if(!done){ raf = requestAnimationFrame(frame); }
  }
  frame();

  function hit(){
    if(done) return; done = true;
    cancelAnimationFrame(raf);
    clearTimeout(auto);
    meterHit.removeEventListener('click', hit);
    meterHit.classList.add('hidden');
    meterEl.style.display = 'none';
    meterLabel.style.display = 'none';
    const pos = parseFloat(meterMark.dataset.pos || '0');
    const d = Math.abs(pos - 50);
    let quality;
    if(d <= diff.bandHalf) quality = 'PERFECT';
    else if(d <= diff.bandHalf * 2.4) quality = 'GOOD';
    else quality = 'MISS';
    // 判定をフィードバック表示してから蹴る
    const label = quality === 'PERFECT' ? 'PERFECT!' : quality === 'GOOD' ? 'GOOD' : 'MISS…';
    showMessage(label, '', 700);
    doKickerShot(zone, quality);
  }
  meterHit.addEventListener('click', hit);
  // 無反応が続いたら最悪タイミングで自動発射
  const auto = setTimeout(()=>{ meterMark.dataset.pos = '0'; hit(); }, 2600);
}

// CPUキーパーの読み（賢く）
function cpuKeeperGuess(playerZone){
  let read = diff.read;
  if(playerZone === lastPlayerKickZone) read += 0.25; // 同じコースの連続は読まれる
  if(rand() < read) return playerZone;
  // はずれ時：中央寄りを多めにカバー
  const weights = [1,1.4,1, 1.2,1.8,1.2, 1.1,1.5,1.1];
  let sum = weights.reduce((a,b)=>a+b,0), r = rand()*sum;
  for(let i=0;i<9;i++){ r -= weights[i]; if(r<=0) return i; }
  return 4;
}

// quality: 'PERFECT' | 'GOOD' | 'MISS'（ミートの精度）
function doKickerShot(zone, quality){
  const guess = cpuKeeperGuess(zone);
  lastPlayerKickZone = zone;

  const target = zonePos(zone);
  let offTarget = false, weak = false;
  if(quality === 'MISS'){ if(rand() < 0.5) offTarget = true; else weak = true; }
  if(quality !== 'PERFECT' && CORNERS.indexOf(zone) >= 0 && rand() < 0.10) offTarget = true;

  let tx = target.x, ty = target.y;
  if(offTarget){ tx = target.x * 1.4; ty = target.y + 0.7; }   // 枠外
  else if(weak){ tx = target.x * 0.4; ty = 0.55; }             // 中央寄りの弱い球

  // 助走 → ボールの横でキック → ボール発射
  runUp(kicker, {x:-1.8, y:0, z:13.9}, {x:-0.5, y:0, z:11.4}, 0.75, ()=>{
    sndKick(); shake = 0.3;
    poseKeeper(guess);   // キーパーは蹴られた瞬間に反応してダイブ
    flyBall({x:tx, y:ty, z:0}, diff.flyKick, ()=>{
      if(offTarget){ resolveShot(false, '枠外！', 'ミートが大きくズレた…'); return; }
      let saved;
      if(weak){ saved = true; }                                   // 弱い球は止められる
      else if(quality === 'PERFECT'){ saved = (guess === zone); } // 完璧は隣カバー無効
      else { saved = (guess === zone) || (isAdjacent(guess, zone) && rand() < diff.cpuAdj); }
      if(saved){ sndNet(); resolveShot(false, 'SAVED!', weak?'ミートが弱かった…':'キーパーに止められた！'); }
      else { sndNet(); sndCheer(); resolveShot(true, 'GOAL!!', quality==='PERFECT'?'完璧なミート！':'ナイスシュート！'); }
    });
  });
}

/* ---- キーパーフェーズ：あなたが守る ---- */
function keeperPhase(){
  hideMessage();
  zoneWrap.style.display = 'block';

  // CPUの狙い：難易度に応じてコーナーを多用
  let targetZone;
  if(rand() < diff.cornerBias){ targetZone = CORNERS[Math.floor(rand()*CORNERS.length)]; }
  else { targetZone = Math.floor(rand()*9); }

  // 助走方向のヒント。フェイント時は逆から入る
  const realSide = Math.sign(zonePos(targetZone).x);
  const feint = rand() < diff.feint;
  const shownSide = feint ? -realSide : (realSide || 1);

  // 反応ゲー: シュートが打たれるまでコース入力は無効
  let playerDive = -1, resolved = false, canReact = false;
  zoneWrap.classList.add('disabled');
  function onDive(e){
    if(resolved || !canReact) return;   // 蹴られる前のタップは無効
    playerDive = parseInt(e.currentTarget.dataset.i, 10);
    zoneButtons.forEach(b=>b.classList.remove('hot'));
    e.currentTarget.classList.add('hot');
    poseKeeper(playerDive);
    sndKick();
  }
  zoneButtons.forEach(b=> b.addEventListener('click', onDive));

  // 相手キッカーが助走 → 蹴った瞬間に反応解禁 → 構えの間 → ボールが飛ぶ
  runUp(kicker, {x:0.9 + shownSide*0.9, y:0, z:12.6}, {x:0.45, y:0, z:11.4}, 0.85, ()=>{
    sndKick(); shake = 0.25;
    canReact = true;
    zoneWrap.classList.remove('disabled');
    showMessage('反応！', '飛ぶコースにタップ', 600);
    const target = zonePos(targetZone);
    // 蹴ってから少し間を置いてボールを発射（反応の余裕）
    setTimeout(()=>{
      flyBall({x:target.x, y:target.y, z:0.3}, diff.flyKeeper, ()=>{
        resolved = true; cleanupZones();
        const saved = (playerDive === targetZone) ||
                      (playerDive >= 0 && isAdjacent(playerDive, targetZone) && rand() < diff.playerAdj);
        if(saved){ sndCheer(); shake = 0.4; resolveShot(false, 'SAVE!!', 'ナイス反応！', true); }
        else { sndNet(); resolveShot(true, 'GOAL...', playerDive<0?'反応が間に合わず…':'コースを外した…', true); }
      }, 'linear');
    }, diff.setPause * 1000);
  });
}

// ボールを目標へ飛ばす。easeMode 'linear' は等速寄り（守備で読み取りやすい）
function flyBall(target, duration, done, easeMode){
  const start = { x: ball.position.x, y: ball.position.y, z: ball.position.z };
  const t0 = performance.now();
  function step(){
    const k = Math.min(1, (performance.now()-t0)/(duration*1000));
    const e = easeMode === 'linear' ? k : 1 - Math.pow(1-k, 2);
    ball.position.x = start.x + (target.x-start.x)*e;
    ball.position.y = start.y + (target.y-start.y)*e + Math.sin(e*Math.PI)*0.3;
    ball.position.z = start.z + (target.z-start.z)*e;
    ball.rotation.x += 0.5; ball.rotation.y += 0.35;
    if(k < 1){ requestAnimationFrame(step); } else if(done){ done(); }
  }
  step();
}

function resolveShot(isGoal, big, sub){
  const youKicked = youAreKicker();
  if(isGoal){ if(youKicked) youScore++; else cpuScore++; }
  history.push({ goal: isGoal });
  updateHud();
  zoneWrap.style.display = 'none';
  timerBar.style.display = 'none';
  showMessage(big, sub, 0);
  setTimeout(()=>{ hideMessage(); round++; nextRound(); }, 1900);
}

function endGame(){
  hud.classList.add('hidden');
  zoneWrap.style.display = 'none';
  const win = youScore > cpuScore, draw = youScore === cpuScore;
  document.getElementById('resultTitle').textContent = win ? 'YOU WIN! 🏆' : draw ? 'DRAW' : 'YOU LOSE...';
  document.getElementById('resultText').innerHTML =
    `難易度 ${diffKey}<br>最終スコア<br><b style="font-size:28px">YOU ${youScore} - ${cpuScore} CPU</b>`;
  document.getElementById('result').classList.remove('hidden');
  if(win){ sndCheer(); }
}

// ---- 起動・UI ----
initScene();
setCameraKicker();

document.querySelectorAll('.diffbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    diffKey = b.dataset.d;
    document.querySelectorAll('.diffbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
});
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', ()=>{
  document.getElementById('result').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
});
</script>
